server {
    listen 80;
    server_name quaisse.me www.quaisse.me;

    root /usr/share/nginx/html;
    index index.html;

    # 1. Rediriger l'IA vers FastAPI
    location /api/ia/ {
        proxy_pass http://91.98.220.102:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;
    }

    # 2. Rediriger l'API vers Spring Boot
    location /api/ {
        # "backend" doit être le nom du service dans ton docker-compose.yml
        proxy_pass http://backend:8080; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;
    }

    # 3. SPA fallback pour React
    location / {
        try_files $uri /index.html;
    }
}
